name: Bug report
description: A parser, card, or CLI result looks wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste raw Claude or Codex transcripts. A redacted fixture or the `--json` summary is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, with paths redacted.
      placeholder: npx agentwrapped --year 2026 --agents claude --json
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex CLI
        - Both
        - Demo fixtures
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentWrapped version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: v22.14.0
    validations:
      required: true
